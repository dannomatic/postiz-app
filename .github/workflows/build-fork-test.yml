name: Build Fork Test Image

# Additive, fork-only workflow for testing custom builds (e.g. the Content
# Library feature) without touching the upstream multi-arch build-containers.yml.
# Publishes a single amd64 image to ghcr.io/<owner>/postiz-app:<tag>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: true
        default: 'library-test'
  push:
    tags:
      - 'library-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          IMAGE=ghcr.io/${{ github.repository_owner }}/postiz-app:$TAG
          echo "Building $IMAGE"
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_VERSION="$TAG" \
            --provenance=false --sbom=false \
            --push .
